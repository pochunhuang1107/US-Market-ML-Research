[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "us-market-ml"
version = "0.1.0"
description = "ML research foundation for US market ETF rotation strategies."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "US Market ML Research" }
]
dependencies = [
  "pandas",
  "numpy",
  "pyarrow",
  "duckdb",
  "pydantic",
  "scikit-learn",
  "PyYAML",
]

[project.scripts]
us-market-ml-baseline-smoke = "us_market_ml.cli.run_baseline_smoke:run_baseline_smoke_from_args"

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
  "mypy",
]
nn = [
  "torch",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["us_market_ml"]
