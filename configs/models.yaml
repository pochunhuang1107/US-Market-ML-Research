baselines:
  ridge:
    enabled: true
    model_type: ridge
    alpha: 1.0
    random_state: 42
  linear_regression:
    enabled: true
    model_type: linear_regression
  random_forest:
    enabled: true
    model_type: random_forest
    n_estimators: 100
    max_depth: null
    random_state: 42

neural_networks:
  mlp:
    enabled: false
    hidden_layers: [128, 64]
    dropout: 0.1
    activation: relu

training_defaults:
  random_seed: 42
  metric: information_coefficient
  early_stopping: false
