experiment:
  name: etf_rotation_baseline
  description: Supervised regression baseline placeholder before neural network models.

data:
  config: configs/data.yaml

features:
  config: configs/features.yaml

labels:
  target_col: excess_return_vs_spy_20d
  benchmark_symbol: SPY
  forward_horizons: [5, 10, 20]
  excess_return_horizons: [20]

split:
  method: walk_forward
  note: Apply walk-forward train/validation/test folds before fitting baselines.

model:
  model_type: ridge
  alpha: 1.0
  random_state: 42
