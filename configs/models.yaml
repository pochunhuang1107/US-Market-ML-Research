baselines:
  logistic_regression:
    enabled: true
    max_iter: 1000
  random_forest:
    enabled: true
    n_estimators: 300
    max_depth: null

neural_networks:
  mlp:
    enabled: false
    hidden_layers: [128, 64]
    dropout: 0.1
    activation: relu

training_defaults:
  random_seed: 42
  metric: information_coefficient
  early_stopping: false

