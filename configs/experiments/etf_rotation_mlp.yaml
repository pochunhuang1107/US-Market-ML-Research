experiment:
  name: etf_rotation_mlp
  description: Placeholder supervised MLP ETF rotation experiment for future runner integration.

data:
  config: configs/data.yaml

features:
  config: configs/features.yaml

runner:
  target_col: excess_return_vs_spy_20d
  prediction_col: prediction
  dataset_config:
    benchmark_symbol: SPY
    forward_horizons: [5, 10, 20]
    excess_return_horizons: [20]
    rank_target_col: excess_return_vs_spy_20d
    rank_col: rank_excess_return_vs_spy_20d
    price_col: close

split:
  method: walk_forward
  note: Pass explicit WalkForwardFold objects to the future MLP runner before fitting.

model:
  type: mlp
  hidden_units: [128, 64]
  dropout: 0.1
  learning_rate: 0.001
  batch_size: 64
  max_epochs: 100
  patience: 10
