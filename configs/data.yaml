# Data inputs are produced by the sibling US-Market-Data repository.
source:
  provider: us-market-data
  format: parquet
  storage: s3
  curated_dataset: etf_daily_ohlcv

local_reader:
  # Local path for research/dev exports from US-Market-Data. File paths may
  # point to a single CSV/parquet file or a directory searched recursively.
  local_data_path: data/curated/etf_daily_ohlcv
  supported_formats:
    - parquet
    - csv
  required_columns:
    - date
    - symbol
    - open
    - high
    - low
    - close
    - volume
    - vwap

s3_reader:
  # Curated ETF daily parquet partitions from US-Market-Data are expected at:
  # s3://{bucket}/{curated_prefix}/symbol={symbol}/year={year}/data.parquet
  bucket: us-market-data-casper
  curated_prefix: curated/etf_daily_prices
  region_name: us-west-2
  example_symbols:
    - SPY
    - QQQ
    - IWM
  example_years:
    - 2022
    - 2023
    - 2024

universe:
  name: core_etf_rotation
  symbols:
    - SPY
    - QQQ
    - IWM
    - EFA
    - EEM
    - TLT
    - GLD
    - VNQ

calendar:
  frequency: daily
  timezone: America/New_York
