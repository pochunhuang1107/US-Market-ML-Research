baselines:
  ridge:
    enabled: true
    model_type: ridge
    alpha: 1.0
    random_state: 42
  linear_regression:
    enabled: true
    model_type: linear_regression
  random_forest:
    enabled: true
    model_type: random_forest
    n_estimators: 100
    max_depth: null
    random_state: 42
  gradient_boosting:
    enabled: true
    model_type: gradient_boosting
    n_estimators: 100
    learning_rate: 0.05
    max_depth: 3
    subsample: 1.0
    min_samples_leaf: 1
    random_state: 42
  extra_trees:
    enabled: true
    model_type: extra_trees
    n_estimators: 100
    max_depth: null
    min_samples_leaf: 1
    max_features: null
    random_state: 42

neural_networks:
  mlp:
    enabled: true
    hidden_units: [128, 64]
    dropout: 0.1
    learning_rate: 0.001
    weight_decay: 0.0
    batch_size: 64
    max_epochs: 100
    patience: 10
    random_state: 42
    device: cpu
    scale_target: true

training_defaults:
  random_seed: 42
  metric: information_coefficient
  early_stopping: true
