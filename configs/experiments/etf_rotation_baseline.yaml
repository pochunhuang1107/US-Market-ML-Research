experiment:
  name: etf_rotation_baseline
  description: Supervised regression baseline runner before neural network models.

data:
  config: configs/data.yaml

runner:
  target_col: excess_return_vs_spy_20d
  prediction_col: prediction
  extra_exclude_feature_cols: []
  dataset_config:
    benchmark_symbol: SPY
    forward_horizons: [5, 10, 20]
    excess_return_horizons: [20]
    rank_target_col: excess_return_vs_spy_20d
    rank_col: rank_excess_return_vs_spy_20d
    price_col: close
  model_config:
    model_type: ridge
    alpha: 1.0
    random_state: 42

split:
  method: walk_forward
  note: Pass explicit WalkForwardFold objects to the baseline runner before fitting.
