experiment:
  name: etf_rotation_baseline
  description: Baseline ETF rotation experiment before neural network models.

data:
  config: configs/data.yaml

features:
  config: configs/features.yaml

labels:
  forward_return_horizon_days: 21
  target: cross_sectional_forward_return_rank

split:
  method: walk_forward
  train_years: 5
  validation_months: 6
  test_months: 6

models:
  include:
    - logistic_regression
    - random_forest

backtest:
  top_k: 5
  rebalance_frequency: monthly
  benchmarks:
    - SPY
    - QQQ
    - equal_weight_universe

